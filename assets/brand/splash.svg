<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Splash apilado (manual pág. 15): símbolo arriba y "ahorita" abajo, sobre transparente.
       El fondo (Hueso) lo pone el plugin de splash. Bricolage Grotesque 800, tracking -4.5 %
       (letter-spacing = -0.045 × 160 = -7.2); scripts/gen-brand-assets.mjs inyecta la fuente.
       La "o" va partida: el texto lleva la "o" invisible y encima se pinta cada mitad recortada,
       con rendija de 8 % del ancho de la "o". Todo cabe en el círculo central de Android 12. -->
  <defs>
    <clipPath id="o-left"><rect x="400" y="560" width="76.5" height="220"/></clipPath>
    <clipPath id="o-right"><rect x="483.5" y="560" width="100" height="220"/></clipPath>
  </defs>
  <g transform="translate(362 262) scale(3)">
    <path d="M46 4 A46 46 0 0 0 46 96 Z" fill="#F2495C"/>
    <path d="M54 4 A46 46 0 0 1 54 96 Z" fill="#FFC24B"/>
  </g>
  <g font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="160" letter-spacing="-7.2">
    <text x="250" y="737" fill="#1B1B1F">ah<tspan fill="none">o</tspan>rita</text>
    <text x="433.7" y="737" fill="#F2495C" clip-path="url(#o-left)">o</text>
    <text x="433.7" y="737" fill="#FFC24B" clip-path="url(#o-right)">o</text>
  </g>
</svg>
