# App Parejas - ajustes para Analytics (Logflare) y Vector, SOLO si se activan.
# Se carga automáticamente con STACK_LOGS=true (scripts/server/lib.sh), después de
# docker-compose.logs.yml (oficial) y de docker-compose.override.yml.
# Por defecto NO se usa: ahorra RAM y evita que Vector lea el socket de Docker (que ve los
# logs de TODOS los contenedores del VPS, también los de otros proyectos).

services:
  analytics:
    container_name: app-parejas-analytics
    mem_limit: ${MEM_ANALYTICS:-768m}
    memswap_limit: ${MEM_ANALYTICS:-768m}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  vector:
    container_name: app-parejas-vector
    mem_limit: ${MEM_VECTOR:-192m}
    memswap_limit: ${MEM_VECTOR:-192m}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
